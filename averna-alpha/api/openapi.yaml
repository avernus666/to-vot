openapi: 3.1.0
info:
  title: AVERNA API
  version: 0.4.0
  description: Telegram-first storefront and business workspace API.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        "200":
          description: Required dependencies are ready
        "503":
          description: A required dependency is unavailable
  /v1/auth/register:
    post:
      operationId: register
      summary: Create a user and their first organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
        "409":
          description: Email already registered
  /v1/auth/login:
    post:
      operationId: login
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
        "401":
          description: Invalid credentials
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Tokens rotated
        "401":
          description: Invalid, expired, or already rotated token
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          description: Session revoked
  /v1/me:
    get:
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
        "401":
          description: Unauthorized
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations the current user belongs to
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization list
        "401":
          description: Unauthorized

  /v1/store/{slug}/products:
    get:
      operationId: listStoreProducts
      summary: List active products in a public storefront
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public catalog
  /v1/store/{slug}/orders:
    post:
      operationId: createStoreOrder
      summary: Create a guest order
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, phone, items]
              properties:
                customer_name: { type: string, maxLength: 160 }
                phone: { type: string, maxLength: 40 }
                email: { type: string, maxLength: 320 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201": { description: Order created and awaiting store confirmation }
        "400": { description: Invalid order or unavailable product }
  /v1/organizations/{organizationID}/products:
    get:
      operationId: listOrganizationProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Organization products }
        "401": { description: Unauthorized }
        "404": { description: Organization not found }
    post:
      operationId: createOrganizationProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price_minor]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                price_minor: { type: integer, minimum: 0 }
      responses:
        "201": { description: Product created }
        "403": { description: Insufficient organization role }
  /v1/organizations/{organizationID}/products/{productID}:
    patch:
      operationId: updateOrganizationProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: productID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price_minor, is_active]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                price_minor: { type: integer, minimum: 0 }
                is_active: { type: boolean }
      responses:
        "200": { description: Product updated }
        "403": { description: Insufficient organization role }
        "404": { description: Product not found }
  /v1/organizations/{organizationID}/orders:
    get:
      operationId: listOrganizationOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Latest organization orders }
        "401": { description: Unauthorized }
        "404": { description: Organization not found }
  /v1/organizations/{organizationID}/orders/{orderID}:
    patch:
      operationId: updateOrganizationOrderStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: organizationID
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: orderID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, completed, cancelled] }
      responses:
        "200": { description: Order status updated }
        "403": { description: Insufficient organization role }
        "404": { description: Order not found }
        "409": { description: Invalid order status transition }
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      summary: Receive Telegram bot updates
      parameters:
        - in: header
          name: X-Telegram-Bot-Api-Secret-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Update accepted }
        "401": { description: Invalid webhook secret }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [alive, ready, not_ready]
        service:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, display_name, organization_name, organization_slug]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        display_name:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
