name: averna

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: averna
      POSTGRES_USER: averna
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - averna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U averna -d averna"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - averna_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://averna:local-dev-only@postgres:5432/averna?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  miniapp:
    profiles: ["app"]
    build:
      context: ./apps/miniapp
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    command: ["-path=/migrations", "-database=postgres://averna:local-dev-only@postgres:5432/averna?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  averna_postgres:
  averna_redis:
